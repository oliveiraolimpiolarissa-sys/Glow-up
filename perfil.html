<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | Glow Up</title>
    <link rel="stylesheet" href="/perfil.css">
</head>

<body>

    <main class="pagina-perfil">

        <section class="perfil">

            <div class="cabecalho-perfil">
                <h1>Meu Perfil</h1>
                <p>Suas informações e cuidados personalizados.</p>
            </div>

            <div class="dados-usuario">
                <h2>Meus dados</h2>

                <p>
                    <strong>Nome:</strong>
                    <span id="nomeUsuario">Carregando...</span>
                </p>

                <p>
                    <strong>E-mail:</strong>
                    <span id="emailUsuario">Carregando...</span>
                </p>
            </div>

            <div class="resultado-perfil">

                <h2>Meu resultado capilar</h2>

                <p id="semResultado">
                    Seu resultado do quiz aparecerá aqui.
                </p>

                <div id="resultadoQuiz"></div>

                <button type="button" id="verResultadoCompleto">
    Ver meu resultado completo
</button>

            </div>

            <div class="acoes-perfil">

                <button type="button" id="refazerQuiz">
                    Refazer meu quiz
                </button>

                <button type="button" id="voltarCabelos">
                    Voltar para cabelos
                </button>

                <button type="button" id="sairConta">
                    Sair da conta
                </button>

            </div>

        </section>

    </main>

    <script src="/perfil.js"></script>

</body>
</html>
