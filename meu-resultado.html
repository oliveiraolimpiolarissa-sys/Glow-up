<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu resultado | Glow Up</title>

    <link rel="stylesheet" href="/meu-resultado.css">
</head>

<body>

<main class="pagina-resultado">

    <section class="card-resultado">

        <h1>Meu resultado</h1>

        <p class="subtitulo">
            Seu resultado personalizado de cuidados com os cabelos.
        </p>

        <div class="resumo-resultado">

            <h2>Seu foco principal</h2>

            <p id="focoPrincipal">
                Carregando...
            </p>

            <p id="textoFoco">
                Carregando...
            </p>

        </div>

        <button type="button" id="verResultadoCompleto">
            Ver meu resultado completo
        </button>

        <button type="button"
                class="voltar"
                onclick="window.location.href='/cabelos.html'">
            Voltar para cabelos
        </button>

    </section>

</main>

<script src="/meu-resultado.js"></script>

</body>

</html>
